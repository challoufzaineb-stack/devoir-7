<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">

      <table class="table table-striped">

        @if (produits?.length != 0) {
        <thead>
          <tr>
            <th>N°</th>
            <th>Id</th>
            <th>Nom</th>
            <th>Prix</th>
            <th>Date Création</th>
            <th>Action</th>
          </tr>
        </thead>
        }

        <tbody>
          @for (produit of produits; track produit.idProduit; let index = $index) {
            <tr>
              <td>{{ index + 1 }}</td>
              <td>{{ produit.idProduit }}</td>
              <td>{{ produit.nomProduit }}</td>
              <td>{{ produit.prixProduit }}</td>
              <td>{{ produit.dateCreation | date:'dd/MM/yyyy' }}</td>
              <td>
                <button class="btn btn-danger me-2" (click)="supprimerProduit(produit)">
                  Supprimer
                </button>
                <a class="btn btn-success" [routerLink]="['/updateProduit', produit.idProduit]">Modifier</a>
              </td>
            </tr>
          }
        </tbody>

      </table>

    </div>
  </div>
</div>
